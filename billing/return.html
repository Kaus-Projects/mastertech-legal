<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MasterTech — You're all set</title>
<style>
  :root{--fg:#16181D;--dim:#4b5563;--line:#e5e7eb;--accent:#2851D4;--bg:#ffffff}
  @media (prefers-color-scheme: dark){:root{--fg:#F4F6F8;--dim:#9AA1AA;--line:#2a2e37;--accent:#7aa2ff;--bg:#16181D}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
  main{max-width:760px;margin:0 auto;padding:40px 22px 80px;min-height:100vh;display:flex;flex-direction:column;justify-content:center;text-align:center}
  .wordmark{font-size:15px;font-weight:600;letter-spacing:.02em;color:var(--dim);margin:0 0 28px}
  h1{font-size:28px;line-height:1.2;margin:0 0 6px}
  p{color:var(--fg)}
  a{color:var(--accent)}
  .btn{display:inline-block;margin:28px auto 0;padding:16px 28px;background:var(--accent);color:#fff;font-size:18px;font-weight:600;border-radius:12px;text-decoration:none;min-width:260px}
  .btn:active{opacity:.85}
  .note{color:var(--dim);font-size:14px}
  hr{border:none;border-top:1px solid var(--line);margin:28px 0}
  footer{color:var(--dim);font-size:13px;margin-top:48px}
</style>
</head>
<body>
<main>
  <p class="wordmark">MasterTech</p>
  <h1>You're all set.</h1>
  <p>Any changes you made are reflected in the app.</p>
  <a class="btn" id="open-app" href="hvacapp://billing/return">Return to MasterTech</a>
  <footer><a href="../privacy.html">Privacy Policy</a></footer>
</main>
<script>
  window.addEventListener('load', function () {
    setTimeout(function () { window.location.href = 'hvacapp://billing/return'; }, 800);
  });
</script>
</body>
</html>
